name: Deploy to Firebase Hosting and Functions

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Build Backend (Server)
        run: npm run build:server

      - name: Check deployment secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ] && [ -n "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Firebase deploy - FIREBASE_SERVICE_ACCOUNT and/or GCP_PROJECT_ID repository secrets are not set. See docs/DEPLOYMENT.md for setup instructions."
          fi

      - name: Deploy to Firebase
        if: steps.check_secrets.outputs.configured == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: '${{ secrets.GCP_PROJECT_ID }}'
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
